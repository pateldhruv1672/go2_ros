amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0
      z: 0.0
    laser_model_type: likelihood_field
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: /scan
    set_initial_pose: true
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.1
    update_min_d: 0.1
    use_sim_time: true
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    backup:
      plugin: nav2_behaviors::BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 5.0
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    enable_stamped_cmd_vel: false
    footprint_topic: local_costmap/published_footprint
    global_frame: map
    local_frame: odom
    max_rotational_vel: 0.2
    min_rotational_vel: 0.05
    robot_base_frame: base_link
    rotational_acc_lim: 0.35
    simulate_ahead_time: 1.0
    spin:
      plugin: nav2_behaviors::Spin
    transform_tolerance: 0.5
    use_sim_time: true
    wait:
      plugin: nav2_behaviors::Wait
bt_navigator:
  ros__parameters:
    bond_heartbeat_period: 0.1
    bt_loop_duration: 10
    default_nav_through_poses_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml
    default_nav_to_pose_bt_xml: /home/runner/work/go2_ros/go2_ros/evidence/arms/smac2d_smoothed_mppi/rep1/bt_smoothed.xml
    default_server_timeout: 20
    error_code_names:
    - compute_path_error_code
    - follow_path_error_code
    follow_point_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/follow_point.xml
    global_frame: map
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    odom_topic: odom
    odometry_calibration_bt_xml: /opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/odometry_calibration.xml
    robot_base_frame: base_link
    use_sim_time: true
    wait_for_service_timeout: 5000
bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: true
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
collision_monitor:
  ros__parameters:
    SlowdownPolygon:
      action_type: slowdown
      min_points: 4
      points: '[[1.20, 0.45], [1.20, -0.45], [-0.25, -0.45], [-0.25, 0.45]]'
      polygon_pub_topic: slowdown_polygon
      slowdown_ratio: 0.35
      type: polygon
      visualize: true
    StopPolygon:
      action_type: stop
      min_points: 4
      points: '[[0.45, 0.28], [0.45, -0.28], [-0.20, -0.28], [-0.20, 0.28]]'
      polygon_pub_topic: stop_polygon
      type: polygon
      visualize: true
    base_frame_id: base_link
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel_out
    enable_stamped_cmd_vel: false
    enabled: true
    observation_sources:
    - scan
    odom_frame_id: odom
    pointcloud:
      enabled: false
      max_height: 0.65
      min_height: 0.05
      min_range: 0.18
      source_timeout: 1.6
      topic: /point_cloud2
      transport_type: raw
      type: pointcloud
    polygons:
    - StopPolygon
    - SlowdownPolygon
    scan:
      enabled: true
      max_height: 2.0
      min_height: 0.0
      source_timeout: 1.6
      topic: /scan
      type: scan
    source_timeout: 1.6
    state_topic: collision_monitor_state
    stop_pub_timeout: 1.0
    transform_tolerance: 0.5
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        near_goal_distance: 0.5
        trajectory_point_step: 2
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.4
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        trajectory_point_step: 4
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: true
        max_angle_to_furthest: 1.0
        mode: 0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 0.5
      ax_max: 0.45
      ax_min: -0.6
      ay_max: 0.0
      az_max: 1.0
      batch_size: 2000
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      gamma: 0.015
      iteration_count: 1
      model_dt: 0.05
      motion_model: DiffDrive
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 1.7
      regenerate_noises: true
      temperature: 0.3
      time_steps: 56
      transform_tolerance: 0.1
      visualize: false
      vx_max: 0.3
      vx_min: 0.0
      vx_std: 0.2
      vy_max: 0.0
      vy_std: 0.0
      wz_max: 0.6
      wz_std: 0.4
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    costmap_update_timeout: 1.0
    current_goal_checker: general_goal_checker
    current_progress_checker: progress_checker
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.5
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.45
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    progress_checker:
      movement_time_allowance: 12.0
      plugin: nav2_controller::PoseProgressChecker
      required_movement_angle: 0.12
      required_movement_radius: 0.08
    progress_checker_plugins:
    - progress_checker
    speed_limit_topic: speed_limit
    transform_tolerance: 0.5
    use_realtime_priority: false
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200]
        ]'
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflation_radius: 0.7
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        combination_method: 1
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 0.0
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          observation_persistence: 1.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          topic: /scan
      origin_x: -250.0
      origin_y: -250.0
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: false
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      static_map: true
      track_unknown_space: false
      transform_tolerance: 0.5
      update_frequency: 2.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200]
        ]'
      global_frame: odom
      height: 5
      inflation_layer:
        cost_scaling_factor: 3.0
        enabled: true
        inflation_radius: 0.65
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          expected_update_rate: 0.0
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          observation_persistence: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.05
          raytrace_max_range: 3.5
          raytrace_min_range: 0.05
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      stvl_layer:
        combination_method: 1
        decay_model: 0
        enabled: true
        map_save_duration: 60.0
        mapping_mode: false
        mark_threshold: 0
        observation_sources: pointcloud
        origin_z: 0.0
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        pointcloud:
          clear_after_reading: true
          clearing: true
          data_type: PointCloud2
          decay_acceleration: 10.0
          expected_update_rate: 0.0
          filter: voxel
          horizontal_fov_angle: 6.283
          inf_is_valid: false
          marking: true
          max_obstacle_height: 1.5
          max_z: 2.0
          min_obstacle_height: 0.05
          min_z: 0.05
          model_type: 0
          observation_persistence: 0.0
          obstacle_range: 3.0
          topic: /point_cloud2
          vertical_fov_angle: 1.0
          voxel_min_points: 0
        publish_voxel_map: false
        track_unknown_space: true
        transform_tolerance: 0.5
        unknown_threshold: 15
        update_footprint_enabled: true
        voxel_decay: 8.0
        voxel_size: 0.05
      transform_tolerance: 0.5
      update_frequency: 10.0
      use_sim_time: true
      width: 5
map_saver:
  ros__parameters:
    free_thresh_default: 0.25
    map_subscribe_transient_local: true
    occupied_thresh_default: 0.65
    save_map_timeout: 5.0
    use_sim_time: true
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/runner/work/go2_ros/go2_ros/evidence/arms/smac2d_smoothed_mppi/rep1/world/arena.yaml
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      cost_travel_multiplier: 2.0
      downsample_costmap: false
      downsampling_factor: 1
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      plugin: nav2_smac_planner::SmacPlanner2D
      smoother:
        max_iterations: 1000
        tolerance: 1.0e-10
        w_data: 0.2
        w_smooth: 0.3
      tolerance: 0.25
      use_final_approach_orientation: false
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    use_sim_time: true
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
