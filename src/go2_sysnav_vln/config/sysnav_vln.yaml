    scan_future_tolerance_sec: 0.20
    min_valid_scan_points: 25
    tf_lookup_timeout_sec: 0.15
    frontier_feed_max_age_sec: 3.0
    ollama_url: http://127.0.0.1:11434
    ollama_model: gemma4:e4b
    ollama_timeout_sec: 90.0
    ollama_think: "false"
    ollama_keep_alive: 10m
