    map_frame: map
    base_frame: base_link
    enable_motion: false
    auto_start: false
    decision_period_sec: 0.50
    startup_grace_sec: 8.0
    max_mission_duration_sec: 600.0
    max_goals: 12
    max_failures: 4
    max_travel_distance_m: 20.0
    post_goal_settle_sec: 3.0
