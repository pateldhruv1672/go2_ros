    frontier_vision_reject_ttl_sec: 20.0
    frontier_vision_unknown_ttl_sec: 5.0
    room_types:
      - classroom
      - laboratory
      - office room
      - meeting room
      - computer lab
      - restroom
      - storage room
      - copy room
      - student lounge
      - reception
      - corridor
