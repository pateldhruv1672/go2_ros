amcl:
  ros__parameters:
    use_sim_time: false

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false

    lambda_short: 0.1
    laser_likelihood_max_dist: 5.0
    laser_max_range: 20.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"

    max_beams: 180
    max_particles: 8000
    min_particles: 2000

    pf_err: 0.05
    pf_z: 0.99

    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1

    robot_model_type: "nav2_amcl::DifferentialMotionModel"

    save_pose_rate: 0.5
    sigma_hit: 0.2

    tf_broadcast: true
    transform_tolerance: 0.2

    update_min_a: 0.2
    update_min_d: 0.25

    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05

    scan_topic: /scan_nav
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0


bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5000

    navigators:
      - navigate_to_pose
      - navigate_through_poses

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    default_nav_to_pose_bt_xml: "/home/digital-twin-admin/Dhruv/sparky/ros2_ws/src/go2_robot_sdk/config/behavior_trees/go2_fast_replanning.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    follow_point_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/follow_point.xml"
    odometry_calibration_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/odometry_calibration.xml"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code


bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: false


bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0
    costmap_update_timeout: 2.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - progress_checker
    current_progress_checker: "progress_checker"

    goal_checker_plugins:
      - general_goal_checker
    current_goal_checker: "general_goal_checker"

    controller_plugins:
      - FollowPath

    use_realtime_priority: false
    enable_stamped_cmd_vel: false

    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.05
      required_movement_angle: 0.10
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.30
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # This workspace's installed Nav2 MPPI expects the legacy model names:
      # DiffDrive, Omni, or Ackermann.
      motion_model: "DiffDrive"

      time_steps: 30
      model_dt: 0.10
      batch_size: 500
      iteration_count: 1

      vx_max: 0.30
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.22

      ax_max: 0.20
      ax_min: -0.25
      ay_max: 0.0
      ay_min: 0.0
      az_max: 0.25

      vx_std: 0.16
      vy_std: 0.0
      wz_std: 0.08

      prune_distance: 1.0
      transform_tolerance: 2.0
      temperature: 0.30
      gamma: 0.015

      visualize: false
      regenerate_noises: false
      open_loop: false

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 1.2
        consider_footprint: false

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
        - VelocityDeadbandCritic

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.6
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: false
        near_goal_distance: 0.5
        trajectory_point_step: 3

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 1.2

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.35

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.30
        trajectory_point_step: 6
        threshold_to_consider: 0.6
        offset_from_furthest: 6
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 22.0
        offset_from_furthest: 5
        threshold_to_consider: 1.2

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 0.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 80.0
        deadband_velocities: [0.07, 0.0, 0.04]


local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 2.0

      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"

      plugins:
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan

        scan:
          topic: /scan_nav
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.55
          obstacle_max_range: 2.5
          obstacle_min_range: 0.55

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 8.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.5
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: pointcloud

        pointcloud:
          data_type: PointCloud2
          topic: /point_cloud2
          marking: true
          clearing: true
          obstacle_range: 3.0
          min_obstacle_height: 0.05
          max_obstacle_height: 1.5
          expected_update_rate: 0.0
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "voxel"
          voxel_min_points: 0
          clear_after_reading: true
          max_z: 2.0
          min_z: 0.05
          vertical_fov_angle: 1.0
          horizontal_fov_angle: 6.283
          decay_acceleration: 10.0
          model_type: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70


global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0

      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 2.0

      resolution: 0.05
      track_unknown_space: true
      static_map: true

      width: 500
      height: 500
      origin_x: -250.0
      origin_y: -250.0

      footprint: "[ [0.360, 0.200], [0.360, -0.200], [-0.450, -0.200], [-0.450, 0.200] ]"

      plugins:
        - static_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.70

      always_send_full_costmap: true


map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""


map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true


planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins:
      - GridBased

    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 500000
      max_on_approach_iterations: 1000
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true


behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false

    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - assisted_teleop
      - wait

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"

    wait:
      plugin: "nav2_behaviors::Wait"

    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.0
    use_sim_time: false

    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2


robot_state_publisher:
  ros__parameters:
    use_sim_time: false


waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200


collision_monitor:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false

    base_frame_id: "base_link"
    odom_frame_id: "odom"
    transform_tolerance: 3.0
    source_timeout: 5.0
    stop_pub_timeout: 2.0

    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel_out"
    state_topic: "collision_monitor_state"

    observation_sources:
      - scan

    scan:
      type: "scan"
      topic: "/scan_nav"
      min_height: 0.0
      max_height: 2.0
      enabled: true

    polygons:
      - StopPolygon
      - SlowdownPolygon

    StopPolygon:
      type: "polygon"
      points: "[[0.45, 0.26], [0.45, -0.26], [-0.25, -0.26], [-0.25, 0.26]]"
      action_type: "stop"
      min_points: 18
      visualize: true
      polygon_pub_topic: "stop_polygon"

    SlowdownPolygon:
      type: "polygon"
      points: "[[0.50, 0.30], [0.50, -0.30], [-0.30, -0.32], [-0.30, 0.32]]"
      action_type: "slowdown"
      slowdown_ratio: 0.70
      min_points: 12
      visualize: true
      polygon_pub_topic: "slowdown_polygon"
